<!doctype html>
<html lang="zh-CN" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polymarket Snapshot</title>
  <meta name="theme-color" content="#faf9f5">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("polymarket_dashboard_theme"); } catch (error) {}
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved === "classic" || saved === "midnight" ? saved : (dark ? "midnight" : "classic");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    /* ---------- Design tokens ---------- */
    :root,
    :root[data-theme="classic"] {
      color-scheme: light;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-serif: "Iowan Old Style", "Charter", Georgia, "Songti SC", "Noto Serif SC", serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

      --bg: #faf9f5;
      --surface: #ffffff;
      --surface-2: #f5f3ec;
      --surface-hover: #f8f6f0;
      --ink: #1f1e1d;
      --ink-2: #3d3b37;
      --muted: #807d75;
      --line: #ebe8df;
      --line-strong: #dcd8cc;

      --accent: #d97757;
      --accent-strong: #c2603f;
      --accent-ink: #b5532f;
      --accent-soft: #fbeee8;
      --accent-line: rgba(217, 119, 87, 0.36);
      --on-accent: #ffffff;

      --profit-up: #c63d3d;
      --profit-down: #2c7d5a;
      --danger: #c63d3d;
      --danger-soft: rgba(198, 61, 61, 0.08);

      --overlay: rgba(250, 249, 245, 0.72);
      --scrim: rgba(31, 30, 29, 0.24);
      --shadow-sm: 0 1px 2px rgba(31, 30, 29, 0.04);
      --shadow-md: 0 12px 32px rgba(31, 30, 29, 0.10);

      --green: var(--profit-up);
      --red: var(--profit-down);
    }

    :root[data-theme="midnight"] {
      color-scheme: dark;
      --bg: #1a1918;
      --surface: #232220;
      --surface-2: #2b2a27;
      --surface-hover: #292826;
      --ink: #f2f0ea;
      --ink-2: #d6d3cb;
      --muted: #9b978d;
      --line: #34322f;
      --line-strong: #45423e;

      --accent: #d97757;
      --accent-strong: #e48a6b;
      --accent-ink: #eb9677;
      --accent-soft: rgba(217, 119, 87, 0.14);
      --accent-line: rgba(217, 119, 87, 0.5);
      --on-accent: #1a1918;

      --profit-up: #ef7373;
      --profit-down: #5cc495;
      --danger: #ef7373;
      --danger-soft: rgba(239, 115, 115, 0.12);

      --overlay: rgba(26, 25, 24, 0.72);
      --scrim: rgba(0, 0, 0, 0.5);
      --shadow-sm: none;
      --shadow-md: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 8px 12px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover { background: var(--surface-hover); border-color: var(--line-strong); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---------- Header ---------- */
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .hero-text { display: grid; gap: 10px; min-width: 0; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-ink);
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(30px, 4vw, 40px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .subtitle { display: none; }


    .wallet-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-2);
    }

    .settings-wallet {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .settings-wallet[hidden] { display: none; }

    .settings-wallet .wallet-chip { height: 26px; padding: 0 8px; margin-left: -2px; }

    .wallet-chip svg { width: 13px; height: 13px; color: var(--muted); }

    .wallet-chip:hover svg { color: var(--accent-ink); }

    .wallet-chip.copied {
      font-family: var(--font-sans);
      color: var(--accent-ink);
      border-color: var(--accent-line);
      background: var(--accent-soft);
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    /* ---------- Metrics ---------- */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card, .table-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card {
      position: relative;
      padding: 18px 20px;
      overflow: hidden;
    }

    .metrics .card:first-child::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .value {
      margin: 0;
      font-size: clamp(24px, 2.6vw, 30px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .metric-note {
      margin: 6px 0 0;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .metric-note:empty { display: none; }

    .sparkline {
      display: none;
      width: 100%;
      height: 32px;
      margin-top: 10px;
      overflow: visible;
    }

    .sparkline.visible { display: block; }

    .spark-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.75;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .spark-area { fill: var(--accent-soft); }

    .card.is-unavailable .value { color: var(--muted); }

    .card.is-unavailable .metric-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-ink);
      cursor: help;
    }

    .card.is-unavailable .metric-note::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }

    /* ---------- Layout ---------- */
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 20px;
      align-items: start;
    }


    .table-card { overflow: hidden; }

    .table-head { padding: 18px 20px 0; }


    .table-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .table-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }


    .table-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.005em;
    }


    /* ---------- Positions table ---------- */
    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th:nth-child(n+3), td:nth-child(n+3) {
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      padding-top: 9px;
      padding-bottom: 9px;
    }

    td { font-size: 14px; color: var(--ink-2); }

    tbody tr { transition: background 0.12s ease; }
    tbody tr:hover { background: var(--surface-hover); }

    .market-cell {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .market-text { display: grid; gap: 2px; min-width: 0; text-align: left; }

    .market-title {
      font-weight: 500;
      color: var(--ink);
      line-height: 1.4;
    }

    .market-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .market-icon {
      position: relative;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      overflow: hidden;
      background: var(--surface-2);
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .market-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cell-price { color: var(--muted); }

    .price-arrow { margin: 0 4px; color: var(--line-strong); }

    .price-now { color: var(--ink); font-weight: 500; }

    .pnl-pct { margin-top: 2px; font-size: 12px; opacity: 0.85; }

    .change-tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-left: 8px;
      padding: 0 6px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      color: var(--ink-2);
      font-size: 11px;
      font-weight: 500;
      line-height: 17px;
      white-space: nowrap;
      vertical-align: 1px;
    }

    .change-tag svg { width: 11px; height: 11px; }

    .change-tag.new {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    .change-tag.closed { color: var(--muted); }

    .change-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 14px;
    }


    .change-filters[hidden] { display: none; }

    .change-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .change-filter:hover { color: var(--ink); }

    .change-filter-count {
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }

    .change-filter.active {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    .change-filter.active .change-filter-count { color: var(--accent-ink); }

    /* Show/hide unchanged markets: a quieter chip pushed to the end of the row. */
    .unchanged-toggle {
      margin-left: auto;
      border-style: dashed;
      background: transparent;
    }

    .unchanged-toggle[aria-pressed="true"] {
      border-style: solid;
      border-color: var(--line-strong);
      background: var(--surface-2);
      color: var(--ink-2);
    }

    .section-row td {
      padding-top: 18px;
      padding-bottom: 8px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      text-align: left !important;
    }

    .is-closed td { color: var(--muted); }

    .is-closed .market-title,
    .is-closed .market-link { color: var(--muted); }

    .is-closed .market-title {
      text-decoration: line-through;
      text-decoration-color: var(--line-strong);
    }

    .is-closed .market-icon { opacity: 0.55; filter: grayscale(1); }

    .muted-dash { color: var(--muted); }

    .group-row td { background: var(--surface); }

    .group-row:hover td { background: var(--surface-hover); }

    .group-toggle {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }

    .group-toggle:hover { background: transparent; }

    .group-chevron {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin: 6px -4px 0 -6px;
      color: var(--muted);
      transition: transform 0.15s ease;
    }

    .group-row.expanded .group-chevron { transform: rotate(90deg); color: var(--accent-ink); }

    .group-row .market-title { color: var(--ink); }

    .group-child td { background: var(--surface-2); border-top-color: transparent; }

    .group-child:hover td { background: var(--surface-hover); }

    .group-child .cell-market { padding-left: 44px; }

    .group-child .market-icon { width: 22px; height: 22px; border-radius: 6px; }

    .market-link {
      color: inherit;
      text-decoration: none;
      background-image: linear-gradient(var(--accent), var(--accent));
      background-size: 0 1px;
      background-position: 0 100%;
      background-repeat: no-repeat;
      transition: background-size 0.2s ease, color 0.15s ease;
    }

    .market-link:hover { color: var(--accent-ink); background-size: 100% 1px; }

    .outcome-pill {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .delta {
      display: block;
      width: fit-content;
      margin: 4px 0 0 auto;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
      white-space: nowrap;
      background: var(--surface-2);
    }

    .delta.positive { background: color-mix(in srgb, var(--green) 11%, transparent); }
    .delta.negative { background: color-mix(in srgb, var(--red) 11%, transparent); }

    :root[data-theme="midnight"] .delta.positive { background: color-mix(in srgb, var(--green) 16%, transparent); }
    :root[data-theme="midnight"] .delta.negative { background: color-mix(in srgb, var(--red) 16%, transparent); }

    .empty {
      padding: 28px 20px 32px;
      color: var(--muted);
      text-align: center;
    }

    /* ---------- Icon buttons & menus ---------- */
    .icon-button {
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-2);
      flex: 0 0 auto;
    }

    .icon-button svg { width: 18px; height: 18px; display: block; }

    .icon-button .icon { display: inline-flex; align-items: center; justify-content: center; }

    #refreshBtn {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }

    #refreshBtn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

    .history-range-button {
      width: auto;
      min-width: 0;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid currentColor;
      border-right-color: transparent;
      opacity: 0.85;
      animation: spin 0.8s linear infinite;
      display: none;
      flex: 0 0 auto;
    }

    .spinner.visible { display: inline-block; }

    .icon-button.loading .icon { display: none; }

    .button-content { display: inline-flex; align-items: center; gap: 8px; }

    .ghost-button {
      background: var(--surface);
      color: var(--ink-2);
    }



    /* ---------- History ---------- */
    .history-panel {
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform-origin: top right;
    }


    .history-panel[hidden] { display: none; }

    .history-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .history-list {
      padding: 0 12px 12px;
      display: grid;
      gap: 6px;
    }

    .history-item {
      width: 100%;
      padding: 10px 10px 10px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .history-item:hover { background: var(--surface-2); }

    .history-item.active {
      background: var(--accent-soft);
      border-color: var(--accent-line);
    }

    .history-item.current {
      background: var(--surface-2);
      border-color: var(--line);
    }

    /* Sits where the compare/delete buttons are on other cards. */
    .history-current-badge {
      flex: 0 0 auto;
      height: 24px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent-ink);
      background: var(--accent-soft);
      border: 1px solid var(--accent-line);
      border-radius: 999px;
    }

    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .history-summary { min-width: 0; display: grid; gap: 2px; }

    .history-time { font-size: 12px; color: var(--muted); cursor: default; }
    /* Both labels share one grid cell; hovering any time cross-fades every card to its full date. */
    .time-swap { display: inline-grid; vertical-align: top; }
    .time-swap > span {
      grid-area: 1 / 1;
      white-space: nowrap;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .time-swap .time-absolute { opacity: 0; transform: translateY(3px); }
    .history-list:has(.history-time:hover) .time-relative { opacity: 0; transform: translateY(-3px); }
    .history-list:has(.history-time:hover) .time-absolute { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .time-swap > span { transition: none; transform: none !important; }
    }

    .history-main {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .history-actions {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }

    .history-action {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: transparent;
      border-color: transparent;
    }

    .history-item:hover .history-action,
    .history-item.active .history-action {
      color: var(--ink-2);
    }

    .history-action:hover {
      background: var(--surface);
      border-color: var(--line);
      color: var(--accent-ink);
    }

    .history-item.active .history-action.compare { color: var(--accent-ink); }

    .history-action.delete:hover {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: transparent;
    }

    .history-action:disabled { opacity: 0.5; cursor: wait; }

    .history-action svg { width: 18px; height: 18px; display: block; }

    .history-action.busy {
      width: auto;
      min-width: 64px;
      padding: 0 10px;
      font-size: 12px;
      color: var(--ink-2);
    }

    .history-pagination {
      padding: 4px 12px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .history-pagination[hidden] { display: none; }

    .history-page-btn { height: 30px; padding: 0 12px; font-size: 12px; }

    .history-page-info {
      min-width: 56px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .compare-note { color: var(--muted); font-size: 13px; margin-top: 8px; }

    /* ---------- Loading and confirm dialogs ---------- */
    .loading-overlay,
    .confirm-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--scrim);
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, visibility 0.18s;
    }

    .loading-overlay { background: var(--overlay); backdrop-filter: blur(2px); }

    .loading-overlay.visible,
    .confirm-modal.visible { opacity: 1; visibility: visible; }

    .loading-card,
    .confirm-panel {
      width: min(380px, 100%);
      padding: 20px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      transform: translateY(6px) scale(0.98);
      transition: transform 0.18s ease;
    }

    .loading-overlay.visible .loading-card,
    .confirm-modal.visible .confirm-panel { transform: none; }

    .dialog-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .dialog-icon {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    .loading-card .dialog-head { align-items: center; }

    .dialog-icon svg { width: 20px; height: 20px; }

    .dialog-icon.danger { background: var(--danger-soft); color: var(--danger); }

    .dialog-copy { min-width: 0; padding-top: 1px; }

    .dialog-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.3;
    }

    .dialog-body {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .loading-bar {
      position: relative;
      height: 3px;
      margin-top: 18px;
      border-radius: 999px;
      background: var(--accent-soft);
      overflow: hidden;
    }

    .loading-bar span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 38%;
      border-radius: inherit;
      background: var(--accent);
      animation: loading-slide 1.3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .loading-elapsed {
      min-height: 16px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 20px;
    }

    .confirm-btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
    }

    .confirm-btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .confirm-btn.danger:hover { filter: brightness(1.06); background: var(--danger); border-color: var(--danger); }

    :root[data-theme="midnight"] .confirm-btn.danger { color: #1a1918; }

    @keyframes loading-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(265%); }
    }

    /* ---------- Settings ---------- */
    .settings-anchor {
      position: relative;
      margin-left: auto;
      flex: 0 0 auto;
    }

    .settings-trigger { color: var(--muted); }

    .settings-trigger:hover,
    .settings-trigger.active { color: var(--ink); }

    .settings-trigger.active {
      background: var(--surface-2);
      border-color: var(--line-strong);
    }

    .settings-trigger svg { transition: transform 0.3s ease; }

    .settings-trigger.active svg { transform: rotate(60deg); }

    .settings-modal {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 30;
      visibility: hidden;
      pointer-events: none;
    }

    .settings-modal.visible { visibility: visible; pointer-events: auto; }

    .settings-panel {
      width: 340px;
      padding: 16px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      transform-origin: top right;
      transform: translateY(-4px) scale(0.98);
      opacity: 0;
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .settings-panel:focus { outline: none; }

    .settings-modal.visible .settings-panel { transform: none; opacity: 1; }

    .settings-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .settings-title {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 500;
      line-height: 1.2;
    }


    .settings-close {
      width: 28px;
      height: 28px;
      margin: -4px -4px 0 0;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }

    .settings-close:hover { background: var(--surface-2); border-color: transparent; color: var(--ink); }

    .settings-close svg { width: 16px; height: 16px; }

    .settings-group { display: grid; gap: 6px; }

    .settings-group + .settings-group { margin-top: 14px; }

    .settings-label { font-size: 12px; font-weight: 500; color: var(--muted); }

    .settings-options {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 2px;
      padding: 3px;
      border-radius: 9px;
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .settings-option {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 30px;
      padding: 4px 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .settings-option:hover { background: transparent; color: var(--ink); }

    .settings-option.active {
      background: var(--surface);
      color: var(--accent-ink);
      box-shadow: 0 1px 3px rgba(31, 30, 29, 0.10), 0 0 0 1px var(--line);
    }

    :root[data-theme="midnight"] .settings-option.active { background: var(--line-strong); }

    .swatch {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .swatch.profit-up { color: var(--profit-up); }
    .swatch.profit-down { color: var(--profit-down); }

    .settings-option:not(.active) .swatch { opacity: 0.6; }

    @media (max-width: 640px) {
      .settings-modal {
        position: fixed;
        inset: 0;
        top: 0;
        display: flex;
        align-items: flex-end;
        background: var(--scrim);
        opacity: 0;
        transition: opacity 0.2s ease, visibility 0.2s;
      }

      .settings-modal.visible { opacity: 1; }

      .settings-panel {
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
        border-radius: 18px 18px 0 0;
        border-bottom: 0;
        transform: translateY(100%);
        opacity: 1;
        transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .settings-panel::before {
        content: "";
        display: block;
        width: 36px;
        height: 4px;
        margin: 0 auto 12px;
        border-radius: 999px;
        background: var(--line-strong);
      }

      .settings-option { min-height: 36px; }

      body.sheet-open { overflow: hidden; }
    }

    /* ---------- Motion ---------- */
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes settings-spin-once {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .page { padding-top: 28px; }
      .metrics { gap: 10px; }
      .card { padding: 14px 16px; }
      .table-head { padding: 16px 16px 0; }
      th, td { padding-left: 12px; padding-right: 12px; }
      th:first-child, td:first-child { padding-left: 16px; }
      th:last-child, td:last-child { padding-right: 16px; }
      table, tbody { display: block; }
      thead { display: none; }

      tbody tr {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-areas:
          "market market market"
          "side price price"
          "size value pnl";
        gap: 10px 12px;
        padding: 14px 16px;
        border-top: 1px solid var(--line);
      }

      tbody td,
      tbody td:first-child,
      tbody td:last-child {
        padding: 0;
        border: 0;
        background: transparent;
      }

      .cell-market { grid-area: market; }
      .cell-side { grid-area: side; text-align: left !important; }
      .cell-price { grid-area: price; align-self: center; font-size: 12px; }
      .cell-size { grid-area: size; text-align: left !important; }
      .cell-value { grid-area: value; }
      .cell-pnl { grid-area: pnl; }

      .cell-size .delta { margin-left: 0; }

      td[data-label]::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
      }

      .cell-price::before { display: none !important; }

      .group-row { grid-template-areas: "market market market" ". value pnl"; }
      .group-row .cell-side, .group-row .cell-size, .group-row .cell-price { display: none; }
      .group-row td, .group-row:hover td { background: transparent; }

      .section-row { display: block; padding: 16px 16px 6px; }
      .section-row td { display: block; padding: 0 !important; }

      .group-child { background: var(--surface-2); }
      .group-child .cell-market { padding-left: 24px; }
      .group-child td, .group-child:hover td { background: transparent; }
      .table-head-row { align-items: flex-start; }
      .table-title-wrap { flex-wrap: wrap; }
      .history-toolbar { margin-left: 0; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-text">
        <div id="heroEyebrow" class="eyebrow">Polymarket</div>
        <h1 id="heroTitle">持仓快照</h1>
        <div id="status" class="status" hidden></div>
      </div>
      <div id="settingsAnchor" class="settings-anchor">
        <button id="settingsBtn" class="icon-button settings-trigger" type="button" aria-label="设置" title="设置" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 8.5A3.5 3.5 0 1 0 12 15.5A3.5 3.5 0 1 0 12 8.5Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M19 12C19 11.47 18.95 10.95 18.84 10.45L21 8.86L18.9 5.14L16.32 6.09C15.54 5.43 14.61 4.97 13.6 4.78L13.2 2H10.8L10.4 4.78C9.39 4.97 8.46 5.43 7.68 6.09L5.1 5.14L3 8.86L5.16 10.45C5.05 10.95 5 11.47 5 12C5 12.53 5.05 13.05 5.16 13.55L3 15.14L5.1 18.86L7.68 17.91C8.46 18.57 9.39 19.03 10.4 19.22L10.8 22H13.2L13.6 19.22C14.61 19.03 15.54 18.57 16.32 17.91L18.9 18.86L21 15.14L18.84 13.55C18.95 13.05 19 12.53 19 12Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="settingsModal" class="settings-modal" aria-hidden="true">
          <div id="settingsPanel" class="settings-panel" role="dialog" aria-labelledby="settingsTitle" tabindex="-1">
            <div class="settings-header">
              <div>
                <div id="settingsTitle" class="settings-title">设置</div>
              </div>
              <button id="settingsCloseBtn" class="icon-button settings-close" type="button" aria-label="关闭" title="关闭">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="settings-group">
              <div id="themeLabel" class="settings-label">主题</div>
              <div class="settings-options">
                <button id="themeSystemBtn" class="settings-option" type="button">跟随系统</button>
                <button id="themeClassicBtn" class="settings-option" type="button">浅色</button>
                <button id="themeMidnightBtn" class="settings-option" type="button">深色</button>
              </div>
            </div>
            <div class="settings-group">
              <div id="languageLabel" class="settings-label">语言</div>
              <div class="settings-options">
                <button id="languageZhBtn" class="settings-option" type="button">中文</button>
                <button id="languageEnBtn" class="settings-option" type="button">English</button>
              </div>
            </div>
            <div class="settings-group">
              <div id="profitColorLabel" class="settings-label">盈亏颜色</div>
              <div class="settings-options">
                <button id="profitColorRedBtn" class="settings-option" type="button">红盈绿亏</button>
                <button id="profitColorGreenBtn" class="settings-option" type="button">绿盈红亏</button>
              </div>
            </div>
            <div class="settings-group">
              <div id="defaultViewLabel" class="settings-label">对比时默认显示</div>
              <div class="settings-options">
                <button id="defaultViewSimplifiedBtn" class="settings-option" type="button">仅有变化</button>
                <button id="defaultViewFullBtn" class="settings-option" type="button">全部</button>
              </div>
            </div>
            <div id="walletRow" class="settings-wallet" hidden>
              <span id="walletLabel">钱包地址：</span>
              <button id="walletChip" class="wallet-chip" type="button">
                <span id="walletChipText" class="wallet-chip-text"></span>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>


    <section class="metrics">
      <article class="card">
        <div id="labelTotalAssets" class="label">总资产</div>
        <p class="value" id="totalAssets">-</p>
        <p id="totalAssetsNote" class="metric-note"></p>
        <svg id="assetsSpark" class="sparkline" viewBox="0 0 200 36" preserveAspectRatio="none" aria-hidden="true"></svg>
      </article>
      <article id="usdcCard" class="card">
        <div id="labelUsdc" class="label">pUSD</div>
        <p class="value" id="usdcBalance">-</p>
        <p id="usdcNote" class="metric-note"></p>
      </article>
      <article class="card">
        <div id="labelPositionsValue" class="label">持仓市值</div>
        <p class="value" id="positionsValue">-</p>
        <p id="positionsValueNote" class="metric-note"></p>
      </article>
      <article class="card">
        <div id="labelComparePnl" class="label">对比盈亏</div>
        <p class="value" id="totalPnl">-</p>
        <p id="totalPnlNote" class="metric-note"></p>
      </article>
    </section>

    <section id="contentGrid" class="content-grid">
      <section class="table-card">
        <div class="table-head">
          <div class="table-head-row">
            <div class="table-title-wrap">
              <h2 id="positionsTitle" class="table-title">持仓明细</h2>
            </div>
          </div>
          <div id="changeFilters" class="change-filters" role="group" hidden></div>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th id="thMarket">市场</th>
              <th id="thOutcome">方向</th>
              <th id="thSize">仓位</th>
              <th id="thPrice">均价 → 现价</th>
              <th id="thCurrentValue">当前价值</th>
              <th id="thPnl">盈亏</th>
            </tr>
          </thead>
          <tbody id="positionsBody"></tbody>
        </table>
        </div>
        <div id="positionsEmpty" class="empty" hidden>暂无持仓数据。</div>
      </section>

      <aside id="historyPanel" class="table-card history-panel">
        <div class="table-head">
          <div class="table-head-row">
            <div class="table-title-wrap">
              <h2 id="historyTitle" class="table-title">历史对比</h2>
              <div id="historyToolbar" class="history-toolbar">
                <button id="compareHighestBtn" class="icon-button history-range-button" type="button" aria-label="highest" title="highest">highest</button>
                <button id="compareLowestBtn" class="icon-button history-range-button" type="button" aria-label="lowest" title="lowest">lowest</button>
                <button id="refreshBtn" class="icon-button" type="button" aria-label="新快照" title="新快照">
                  <span class="icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                      <circle cx="12" cy="13" r="4"/>
                    </svg>
                  </span>
                  <span id="refreshSpinner" class="spinner" aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div id="historyList" class="history-list"></div>
        <div id="historyPagination" class="history-pagination" hidden>
          <button id="historyPrevBtn" class="history-page-btn" type="button">上一页</button>
          <div id="historyPageInfo" class="history-page-info">1 / 1</div>
          <button id="historyNextBtn" class="history-page-btn" type="button">下一页</button>
        </div>
        <div id="historyEmpty" class="empty" hidden>暂无历史快照。</div>
      </aside>
    </section>
  </main>

  <div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
    <div class="loading-card" role="status" aria-live="polite">
      <div class="dialog-head">
        <span id="loadingIcon" class="dialog-icon" aria-hidden="true"></span>
        <div class="dialog-copy">
          <div id="loadingText" class="dialog-title">正在拉取最新数据</div>
        </div>
      </div>
      <div class="loading-bar" aria-hidden="true"><span></span></div>
      <div id="loadingElapsed" class="loading-elapsed"></div>
    </div>
  </div>

  <div id="confirmModal" class="confirm-modal" aria-hidden="true">
    <div id="confirmPanel" class="confirm-panel" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
      <div class="dialog-head">
        <span class="dialog-icon danger" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7H20M9 4H15M10 11V17M14 11V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="6" y="7" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
        </span>
        <div class="dialog-copy">
          <div id="confirmTitle" class="dialog-title"></div>
          <p id="confirmBody" class="dialog-body"></p>
        </div>
      </div>
      <div class="confirm-actions">
        <button id="confirmCancelBtn" class="confirm-btn" type="button"></button>
        <button id="confirmOkBtn" class="confirm-btn danger" type="button"></button>
      </div>
    </div>
  </div>


  <script>
    const el = {

    let latestPayload = null;

    let busyAction = null;
    let busySnapshotId = null;
    let hideUnchangedMarkets = false;
    let latestComparePayload = null;

    let settingsOpen = false;
    const expandedGroups = new Set();
    const CHANGE_FILTERS = ["all", "new", "added", "reduced", "closed", "price"];
    let changeFilter = "all";
    let lastRenderedPositions = [];

    const HISTORY_PAGE_SIZE = 5;

    const STORAGE_KEYS = {
      theme: "polymarket_dashboard_theme",

    function loadSettings() {

      const savedDefaultCompareView = localStorage.getItem(STORAGE_KEYS.defaultCompareView);
      const savedLanguage = localStorage.getItem(STORAGE_KEYS.language);
      if (savedTheme === "system" || savedTheme === "classic" || savedTheme === "midnight") {
        currentTheme = savedTheme;
      }
      if (savedProfitColorMode === "green-profit" || savedProfitColorMode === "red-profit") {
        profitColorMode = savedProfitColorMode;
      }
      if (savedDefaultCompareView === "full" || savedDefaultCompareView === "simplified") {
        defaultCompareView = savedDefaultCompareView;
      }
      if (savedLanguage === "zh" || savedLanguage === "en") {
        currentLanguage = savedLanguage;
      }
      hideUnchangedMarkets = defaultCompareView === "simplified";

      return `${sign}${formatMoney(Math.abs(number))}`;
    }

      el.loadingOverlay.classList.toggle("visible", visible);

      if (title) {

      el.loadingIcon.innerHTML = DIALOG_ICONS[kind] || DIALOG_ICONS.refresh;
      el.loadingIcon.classList.toggle("danger", kind === "delete");
      const startedAt = Date.now();
      overlayTimer = setInterval(() => {

    function confirmDialog({ title, body, confirmLabel, cancelLabel }) {
      if (confirmResolver) confirmResolver(false);
      confirmReturnFocus = document.activeElement;
      el.confirmTitle.textContent = title;
      el.confirmBody.textContent = body;
      el.confirmOkBtn.textContent = confirmLabel;
      el.confirmCancelBtn.textContent = cancelLabel;
      el.confirmModal.classList.add("visible");
      el.confirmModal.setAttribute("aria-hidden", "false");
      el.confirmCancelBtn.focus({ preventScroll: true });
      return new Promise((resolve) => {
        confirmResolver = resolve;
      });

    function closeConfirm(result) {
      if (!confirmResolver) return;
      const resolve = confirmResolver;
      confirmResolver = null;
      el.confirmModal.classList.remove("visible");
      el.confirmModal.setAttribute("aria-hidden", "true");
      if (confirmReturnFocus && document.contains(confirmReturnFocus)) {
        confirmReturnFocus.focus({ preventScroll: true });
      }
      resolve(result);

    function setHistoryActionState(action = null, snapshotId = null) {
      busyAction = action;
      busySnapshotId = snapshotId;
      syncHistoryToolbar();
      if (latestPayload) {
        renderHistory(latestPayload.history || [], latestPayload.snapshot?.id);
      }
    }

    function getRecentHistoryCandidates(limit = 10) {
      if (!Array.isArray(latestPayload?.history)) return [];
      const currentSnapshotId = Number(latestPayload?.snapshot?.id || 0);
      return latestPayload.history
        .filter((item) => Number(item.id) !== currentSnapshotId)
        .slice(0, limit);
    }

    function getHistoryTotalAssetValue(item) {
      return Number(item?.total_assets ?? item?.positions_current_value ?? 0);
    }

    function getExtremeHistorySnapshot(direction) {
      const candidates = getRecentHistoryCandidates(10);
      if (!candidates.length) return null;
      return candidates.reduce((best, item) => {
        if (!best) return item;
        const currentValue = getHistoryTotalAssetValue(item);
        const bestValue = getHistoryTotalAssetValue(best);
        if (direction === "max") {
          return currentValue > bestValue ? item : best;
        }
        return currentValue < bestValue ? item : best;
      }, null);
    }

    function syncHistoryToolbar() {
      const hasCandidates = getRecentHistoryCandidates(10).length > 0;
      const disabled = isRefreshing || busyAction === "delete" || busyAction === "compare";
      el.compareHighestBtn.disabled = disabled || !hasCandidates;
      el.compareLowestBtn.disabled = disabled || !hasCandidates;
    }


    function formatSnapshotTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat(currentLanguage === "en" ? "en-US" : "zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function formatShortTime(value) {
      const date = new Date(value);
      if (!value || Number.isNaN(date.getTime())) return "-";
      return new Intl.DateTimeFormat(currentLanguage === "en" ? "en-US" : "zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function formatSnapshotTimeCompact(value) {
      return formatSnapshotTime(value);
    }

    // "3 小时前" / "3 hours ago"; hovering any history time reveals every full time.
    const RELATIVE_UNITS = [
      ["year", 365 * 86400],
      ["month", 30 * 86400],
      ["day", 86400],
      ["hour", 3600],
      ["minute", 60]
    ];

    function formatRelativeTime(value) {
      const date = new Date(value);
      if (!value || Number.isNaN(date.getTime())) return "-";
      const seconds = (Date.now() - date.getTime()) / 1000;
      if (seconds < 60) return currentLanguage === "en" ? "just now" : "刚刚";
      const formatter = new Intl.RelativeTimeFormat(currentLanguage === "en" ? "en" : "zh-CN", { numeric: "always" });
      const [unit, size] = RELATIVE_UNITS.find(([, unitSeconds]) => seconds >= unitSeconds);
      return formatter.format(-Math.floor(seconds / size), unit);
    }

    // Keep relative labels current while the page stays open.
    setInterval(() => {
      document.querySelectorAll(".history-time[datetime] .time-relative").forEach((node) => {
        node.textContent = formatRelativeTime(node.closest("time").getAttribute("datetime"));
      });
    }, 60_000);

    function formatSignedNumber(value, fractionDigits = 2) {
      const number = Number(value || 0);
      const sign = number > 0 ? "+" : "";
      return `${sign}${new Intl.NumberFormat("en-US", {
        maximumFractionDigits: fractionDigits,
        minimumFractionDigits: 0
      }).format(number)}`;
    }

    function buildMarketUrl(row) {
      if (!row || !row.event_slug || !row.slug) return "";
      return `https://polymarket.com/event/${row.event_slug}/${row.slug}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function shortAddress(address) {
      const value = String(address || "");
      return value.length > 12 ? `${value.slice(0, 6)}…${value.slice(-4)}` : value;
    }

    function formatCents(price) {
      const number = Number(price);
      if (!Number.isFinite(number)) return "-";
      const cents = Math.round(number * 1000) / 10;
      return `${cents}¢`;
    }

    function formatSignedPercent(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "";
      const sign = number > 0 ? "+" : number < 0 ? "-" : "";
      return `${sign}${Math.abs(number).toFixed(1)}%`;
    }

    function formatSettlement(endDate) {
      if (!endDate) return "";
      const end = Date.parse(`${String(endDate).slice(0, 10)}T00:00:00Z`);
      if (Number.isNaN(end)) return "";
      const now = new Date();
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.round((end - today) / 86400000);
      if (days > 0) return t("settleInDays", { days });
      if (days === 0) return t("settleToday");
      return t("settleEnded");
    }

    function humanizeSlug(slug) {
      const text = String(slug || "")
        .replace(/-(\d+)$/, (match, digits) => (/^(19|20)\d\d$/.test(digits) ? match : ""))
        .split("-").filter(Boolean).join(" ");
      return text ? text.charAt(0).toUpperCase() + text.slice(1) : "-";
    }

    function getPusdResult(payload) {
      const result = payload?.live?.usdcResult;
      return result && typeof result === "object" ? result : null;
    }

    function isPusdUnavailable(payload) {
      return getPusdResult(payload)?.result === false;
    }

    function renderWalletChip(walletAddress) {
      el.walletRow.hidden = !walletAddress;
      el.walletChip.dataset.address = walletAddress || "";
      el.walletChip.classList.remove("copied");
      el.walletChipText.textContent = shortAddress(walletAddress);
    }

    async function copyWalletAddress() {
      const address = el.walletChip.dataset.address;
      if (!address) return;
      try {
        await navigator.clipboard.writeText(address);
      } catch (error) {
        const input = document.createElement("textarea");
        input.value = address;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }
      el.walletChip.classList.add("copied");
      el.walletChipText.textContent = t("copied");
      clearTimeout(copiedTimer);
      copiedTimer = setTimeout(() => {
        el.walletChip.classList.remove("copied");
        el.walletChipText.textContent = shortAddress(address);
      }, 1400);
    }

    function getAssetSeries() {
      const history = Array.isArray(latestPayload?.history) ? [...latestPayload.history] : [];
      const points = history
        .slice()
        .sort((a, b) => String(a.snapshot_at).localeCompare(String(b.snapshot_at)))
        .map((item) => Number(item.total_assets))
        .filter((value) => Number.isFinite(value));
      const snapshot = latestPayload?.snapshot;
      const inHistory = snapshot?.id && history.some((item) => Number(item.id) === Number(snapshot.id));
      if (snapshot && !inHistory && Number.isFinite(Number(snapshot.total_assets))) {
        points.push(Number(snapshot.total_assets));
      }
      return points;
    }

    function renderSparkline() {
      const points = getAssetSeries();
      if (points.length < 2) {
        el.assetsSpark.innerHTML = "";
        el.assetsSpark.classList.remove("visible");
        return;
      }
      const width = 200;
      const height = 36;
      const pad = 3;
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = max - min || 1;
      const coords = points.map((value, index) => [
        (index / (points.length - 1)) * width,
        pad + (1 - (value - min) / range) * (height - pad * 2)
      ]);
      const line = coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
      const area = `0,${height} ${line} ${width},${height}`;
      el.assetsSpark.innerHTML = `
        <polygon class="spark-area" points="${area}"></polygon>
        <polyline class="spark-line" points="${line}" vector-effect="non-scaling-stroke"></polyline>
      `;
      el.assetsSpark.classList.add("visible");
    }

    function renderComparePnl(compareSnapshot = null) {
      if (!latestPayload?.snapshot || !compareSnapshot) {
        el.totalPnl.textContent = "-";
        el.totalPnl.className = "value";
        el.totalPnlNote.textContent = "";
        return;
      }

      const previous = Number(compareSnapshot.total_assets || 0);
      const diff = Number(latestPayload.snapshot.total_assets || 0) - previous;
      el.totalPnl.textContent = formatSignedMoney(diff);
      el.totalPnl.className = `value ${pnlClass(diff)}`.trim();
      const pct = previous ? formatSignedPercent((diff / previous) * 100) : "";
      const note = t("compareNote", {
        pct: pct || "-",
        time: formatShortTime(compareSnapshot.snapshot_at)
      });
      el.totalPnlNote.textContent = isPusdUnavailable(latestPayload)
        ? `${note} · ${t("totalExcludesPusd")}`
        : note;
    }

    function renderSnapshot(snapshot, walletAddress) {
      const pusdUnavailable = Boolean(snapshot) && isPusdUnavailable(latestPayload);
      el.totalAssets.textContent = snapshot ? formatMoney(snapshot.total_assets) : "-";
      el.totalAssetsNote.textContent = pusdUnavailable ? t("totalExcludesPusd") : "";
      el.usdcBalance.textContent = snapshot && !pusdUnavailable ? formatMoney(snapshot.usdc_balance) : "—";
      el.usdcCard.classList.toggle("is-unavailable", pusdUnavailable);
      el.usdcNote.textContent = pusdUnavailable ? t("pusdFailed") : "";
      el.usdcNote.title = pusdUnavailable ? String(getPusdResult(latestPayload)?.error || "") : "";
      el.positionsValue.textContent = snapshot ? formatMoney(snapshot.positions_current_value) : "-";
      const activeCount = Array.isArray(latestPayload?.positions) ? latestPayload.positions.length : 0;
      el.positionsValueNote.textContent = snapshot ? t("positionsCountNote", { count: activeCount }) : "";
      renderWalletChip(walletAddress);
      renderSparkline();
      renderComparePnl(null);
    }

    const STATUS_LABEL_KEYS = {
      new: "statusNew",
      added: "statusAdded",
      reduced: "statusReduced",
      closed: "statusClosed",
      price: "statusPrice"
    };

    function getChangeStatus(row, compareSnapshot) {
      if (!compareSnapshot) return null;
      if (row.change_status) return row.change_status;
      const diffSize = Number(row.diff_size || 0);
      const diffValue = Number(row.diff_current_value || 0);
      if (diffSize !== 0) return diffSize > 0 ? "added" : "reduced";
      return Math.abs(diffValue) >= 1 ? "price" : "unchanged";
    }

    function renderChangeTag(status) {
      if (!status || status === "price" || status === "unchanged") return "";
      const arrow = status === "added"
        ? '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : status === "reduced"
          ? '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : "";
      return `<span class="change-tag ${status}">${arrow}${escapeHtml(t(STATUS_LABEL_KEYS[status]))}</span>`;
    }

    function renderChangeFilters(counts, visible, unchangedCount = 0) {
      el.changeFilters.hidden = !visible;
      if (!visible) {
        el.changeFilters.innerHTML = "";
        return;
      }
      el.changeFilters.innerHTML = "";
      for (const key of CHANGE_FILTERS) {
        const count = key === "all" ? counts.all : counts[key] || 0;
        if (key !== "all" && count === 0 && changeFilter !== key) continue;
        const button = document.createElement("button");
        button.type = "button";
        button.className = `change-filter${changeFilter === key ? " active" : ""}`;
        button.setAttribute("aria-pressed", changeFilter === key ? "true" : "false");
        button.innerHTML = `${escapeHtml(key === "all" ? t("filterAll") : t(STATUS_LABEL_KEYS[key]))}<span class="change-filter-count">${count}</span>`;
        button.addEventListener("click", () => {
          changeFilter = changeFilter === key && key !== "all" ? "all" : key;
          renderPositions(lastRenderedPositions, lastRenderedCompare);
        });
        el.changeFilters.appendChild(button);
      }
      if (unchangedCount > 0) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "change-filter unchanged-toggle";
        toggle.setAttribute("aria-pressed", hideUnchangedMarkets ? "false" : "true");
        toggle.innerHTML = hideUnchangedMarkets
          ? `${escapeHtml(t("showUnchanged"))}<span class="change-filter-count">${unchangedCount}</span>`
          : escapeHtml(t("hideUnchanged"));
        toggle.addEventListener("click", () => {
          hideUnchangedMarkets = !hideUnchangedMarkets;
          renderPositions(lastRenderedPositions, lastRenderedCompare);
        });
        el.changeFilters.appendChild(toggle);
      }
    }

    function renderDelta(value, formatter) {
      return `<span class="delta ${pnlClass(value)}">${formatter(value)}</span>`;
    }

    function renderMarketIcon(row) {
      const letter = escapeHtml(String(row.title || "?").trim().charAt(0).toUpperCase() || "?");
      const icon = typeof row.icon === "string" && /^https:\/\//.test(row.icon) ? row.icon : "";
      const image = icon
        ? `<img src="${escapeHtml(icon)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
        : "";
      return `<span class="market-icon" aria-hidden="true"><span>${letter}</span>${image}</span>`;
    }

    function buildPositionRow(row, compareSnapshot, isChild) {
      const status = getChangeStatus(row, compareSnapshot);
      const isClosed = status === "closed";
      const marketUrl = buildMarketUrl(row);
      const title = escapeHtml(row.title || "-");
      const marketTitle = marketUrl
        ? `<a class="market-link" href="${escapeHtml(marketUrl)}" target="_blank" rel="noreferrer">${title}</a>`
        : title;
      const sizeDeltaValue = Number(row.diff_size || 0);
      const valueDeltaValue = Number(row.diff_current_value || 0);
      const showDeltas = compareSnapshot && status !== "new";
      const sizeDelta = showDeltas && Math.round(sizeDeltaValue) !== 0
        ? renderDelta(Math.round(sizeDeltaValue), (value) => formatSignedNumber(value, 0))
        : "";
      const valueDelta = showDeltas && valueDeltaValue !== 0
        ? renderDelta(valueDeltaValue, formatSignedMoney)
        : "";
      const settlement = isClosed ? "" : formatSettlement(row.end_date);
      const percent = isClosed ? "" : formatSignedPercent(row.percent_pnl);
      const hasRealized = isClosed && row.realized_pnl !== null && row.realized_pnl !== undefined;
      const pnlCell = isClosed
        ? (hasRealized
            ? `<div class="${pnlClass(row.realized_pnl)}">${formatSignedMoney(row.realized_pnl)}</div><div class="pnl-pct">${escapeHtml(t("realizedLabel"))}</div>`
            : `<div class="muted-dash">—</div>`)
        : `<div class="${pnlClass(row.cash_pnl)}">${formatSignedMoney(row.cash_pnl)}</div>
          ${percent ? `<div class="pnl-pct ${pnlClass(row.percent_pnl)}">${percent}</div>` : ""}`;
      const priceCell = isClosed
        ? `<span class="muted-dash">—</span>`
        : `<span class="price-avg">${formatCents(row.avg_price)}</span><span class="price-arrow">→</span><span class="price-now">${formatCents(row.cur_price)}</span>`;
      const tr = document.createElement("tr");
      tr.className = ["position-row", isChild ? "group-child" : "", isClosed ? "is-closed" : ""].filter(Boolean).join(" ");
      tr.innerHTML = `
        <td class="cell-market">
          <div class="market-cell">
            ${renderMarketIcon(row)}
            <div class="market-text">
              <div class="market-title">${marketTitle}${renderChangeTag(status)}</div>
              ${settlement ? `<div class="market-meta">${escapeHtml(settlement)}</div>` : ""}
            </div>
          </div>
        </td>
        <td class="cell-side"><span class="outcome-pill">${escapeHtml(row.outcome || "-")}</span></td>
        <td class="cell-size" data-label="${escapeHtml(t("thSize"))}">${formatInteger(row.size)}${sizeDelta}</td>
        <td class="cell-price" data-label="${escapeHtml(t("thPrice"))}">${priceCell}</td>
        <td class="cell-value" data-label="${escapeHtml(t("thCurrentValue"))}">${formatMoney(row.current_value)}${valueDelta}</td>
        <td class="cell-pnl" data-label="${escapeHtml(t("thPnl"))}">${pnlCell}</td>
      `;
      return tr;
    }

    // Status shared by every market in the group, if any.
    function groupUniformStatus(group, compareSnapshot) {
      const statuses = new Set(group.rows.map((row) => getChangeStatus(row, compareSnapshot)));
      return statuses.size === 1 ? [...statuses][0] : null;
    }

    function groupMeta(group, compareSnapshot) {
      const parts = [t("groupMarkets", { count: group.rows.length })];
      if (groupUniformStatus(group, compareSnapshot)) return parts[0];
      for (const status of ["new", "added", "reduced"]) {
        const count = group.rows.filter((row) => getChangeStatus(row, compareSnapshot) === status).length;
        if (count) parts.push(`${count} ${t(STATUS_LABEL_KEYS[status])}`);
      }
      return parts.join(" · ");
    }

    function buildGroupRow(group, compareSnapshot) {
      const expanded = expandedGroups.has(group.key);
      const totalValue = group.rows.reduce((sum, row) => sum + Number(row.current_value || 0), 0);
      const totalPnl = group.rows.reduce((sum, row) => sum + Number(row.cash_pnl || 0), 0);
      const totalCost = group.rows.reduce((sum, row) => sum + Number(row.initial_value || 0), 0);
      const totalDelta = group.rows.reduce((sum, row) => sum + Number(row.diff_current_value || 0), 0);
      const roundedDelta = Math.round(totalDelta * 100) / 100;
      const percent = totalCost ? formatSignedPercent((totalPnl / totalCost) * 100) : "";
      const valueDelta = compareSnapshot && roundedDelta !== 0 ? renderDelta(roundedDelta, formatSignedMoney) : "";
      const tr = document.createElement("tr");
      tr.className = `group-row${expanded ? " expanded" : ""}`;
      tr.innerHTML = `
        <td class="cell-market">
          <button class="group-toggle" type="button" aria-expanded="${expanded}">
            <svg class="group-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            ${renderMarketIcon(group.rows[0])}
            <span class="market-text">
              <span class="market-title">${escapeHtml(humanizeSlug(group.key))}${renderChangeTag(groupUniformStatus(group, compareSnapshot))}</span>
              <span class="market-meta">${escapeHtml(groupMeta(group, compareSnapshot))}</span>
            </span>
          </button>
        </td>
        <td class="cell-side"></td>
        <td class="cell-size"></td>
        <td class="cell-price"></td>
        <td class="cell-value" data-label="${escapeHtml(t("thCurrentValue"))}">${formatMoney(totalValue)}${valueDelta}</td>
        <td class="cell-pnl" data-label="${escapeHtml(t("thPnl"))}">
          <div class="${pnlClass(totalPnl)}">${formatSignedMoney(totalPnl)}</div>
          ${percent ? `<div class="pnl-pct ${pnlClass(totalPnl)}">${percent}</div>` : ""}
        </td>
      `;
      tr.querySelector(".group-toggle").addEventListener("click", () => {
        if (expandedGroups.has(group.key)) {
          expandedGroups.delete(group.key);
        } else {
          expandedGroups.add(group.key);
        }
        renderPositions(lastRenderedPositions, lastRenderedCompare);
      });
      return tr;
    }

    function renderPositions(positions, compareSnapshot = null) {
      lastRenderedPositions = Array.isArray(positions) ? positions : [];
      lastRenderedCompare = compareSnapshot;
      el.positionsBody.innerHTML = "";
      const visibleRows = lastRenderedPositions.filter((row) => {
        if (!compareSnapshot) return true;
        const status = getChangeStatus(row, compareSnapshot);
        return !(hideUnchangedMarkets && status === "unchanged");
      });
      const unchangedCount = compareSnapshot
        ? lastRenderedPositions.filter((row) => getChangeStatus(row, compareSnapshot) === "unchanged").length
        : 0;
      const counts = { all: visibleRows.length };
      for (const row of visibleRows) {
        const status = getChangeStatus(row, compareSnapshot);
        counts[status] = (counts[status] || 0) + 1;
      }
      if (changeFilter !== "all" && !counts[changeFilter]) {
        changeFilter = "all";
      }
      renderChangeFilters(counts, Boolean(compareSnapshot), unchangedCount);
      const filteredPositions = changeFilter === "all"
        ? visibleRows
        : visibleRows.filter((row) => getChangeStatus(row, compareSnapshot) === changeFilter);
      const hasPositions = filteredPositions.length > 0;
      el.positionsEmpty.hidden = hasPositions;

      if (!hasPositions) return;

      const openRows = filteredPositions.filter((row) => getChangeStatus(row, compareSnapshot) !== "closed");
      const closedRows = filteredPositions
        .filter((row) => getChangeStatus(row, compareSnapshot) === "closed")
        .sort((a, b) => Number(b.previous_current_value || 0) - Number(a.previous_current_value || 0));

      const groupsByKey = new Map();
      for (const row of openRows) {
        const key = row.event_slug || `${row.condition_id}::${row.outcome}`;
        if (!groupsByKey.has(key)) {
          groupsByKey.set(key, { key, rows: [] });
        }
        groupsByKey.get(key).rows.push(row);
      }
      const groups = [...groupsByKey.values()].map((group) => {
        group.rows.sort((a, b) => Number(b.current_value || 0) - Number(a.current_value || 0));
        group.total = group.rows.reduce((sum, row) => sum + Number(row.current_value || 0), 0);
        return group;
      });
      groups.sort((a, b) => b.total - a.total);

      for (const group of groups) {
        if (group.rows.length === 1) {
          el.positionsBody.appendChild(buildPositionRow(group.rows[0], compareSnapshot, false));
          continue;
        }
        el.positionsBody.appendChild(buildGroupRow(group, compareSnapshot));
        if (expandedGroups.has(group.key)) {
          for (const row of group.rows) {
            el.positionsBody.appendChild(buildPositionRow(row, compareSnapshot, true));
          }
        }
      }

      if (closedRows.length) {
        const closedValue = closedRows.reduce((sum, row) => sum + Number(row.previous_current_value || 0), 0);
        const header = document.createElement("tr");
        header.className = "section-row";
        const closedSinceAt = lastRenderedClosedSince?.snapshot_at || compareSnapshot?.snapshot_at;
        let closedLabel = t("closedSection", { count: closedRows.length, value: formatMoney(closedValue) });
        if (closedSinceAt && closedSinceAt !== compareSnapshot?.snapshot_at) {
          closedLabel += t("closedSectionSince", { time: formatShortTime(closedSinceAt) });
        }
        header.innerHTML = `<td colspan="6">${escapeHtml(closedLabel)}</td>`;
        el.positionsBody.appendChild(header);
        for (const row of closedRows) {
          el.positionsBody.appendChild(buildPositionRow(row, compareSnapshot, false));
        }
      }
    }

    function rerenderData() {
      if (!latestPayload) return;
      renderSnapshot(latestPayload.snapshot, latestPayload.walletAddress);
      if (latestComparePayload?.compareSnapshot) {
        renderPositions(latestComparePayload.positions || [], latestComparePayload.compareSnapshot);
        renderComparePnl(latestComparePayload.compareSnapshot);
      } else {
        renderPositions(latestPayload.positions || []);
      }
      renderHistory(latestPayload.history || [], latestPayload.snapshot?.id);
    }

    function renderHistory(history, currentSnapshotId) {
      el.historyList.innerHTML = "";
      const hasHistory = Array.isArray(history) && history.length > 0;
      el.historyEmpty.hidden = hasHistory;
      el.historyPagination.hidden = true;
      syncHistoryToolbar();

      if (!hasHistory) return;

      const totalPages = Math.max(1, Math.ceil(history.length / HISTORY_PAGE_SIZE));
      historyPage = Math.min(Math.max(historyPage, 1), totalPages);
      const startIndex = (historyPage - 1) * HISTORY_PAGE_SIZE;
      const pageItems = history.slice(startIndex, startIndex + HISTORY_PAGE_SIZE);

      el.historyPagination.hidden = totalPages <= 1;
      el.historyPrevBtn.disabled = historyPage <= 1;
      el.historyNextBtn.disabled = historyPage >= totalPages;
      el.historyPageInfo.textContent = t("historyPageInfo", {
        current: historyPage,
        total: totalPages
      });

      for (const item of pageItems) {
        const isCurrent = Number(item.id) === Number(currentSnapshotId);
        const isActive = Number(item.id) === Number(activeCompareSnapshotId);
        const card = document.createElement("div");
        card.className = `history-item${isActive ? " active" : ""}${isCurrent ? " current" : ""}`;
        card.innerHTML = `
          <div class="history-row">
            <div class="history-summary">
              <time class="history-time" datetime="${escapeHtml(item.snapshot_at)}"><span class="time-swap"><span class="time-relative">${formatRelativeTime(item.snapshot_at)}</span><span class="time-absolute" aria-hidden="true">${formatSnapshotTime(item.snapshot_at)}</span></span></time>
              <div class="history-main">${formatMoney(item.total_assets)}</div>
            </div>
            ${isCurrent ? `<span class="history-current-badge">${t("currentBadge")}</span>` : `
            <div class="history-actions">
              <button class="history-action compare" type="button">${t("compare")}</button>
              <button class="history-action delete" type="button">${t("delete")}</button>
            </div>
            `}
          </div>
        `;

        if (isCurrent) {
          card.title = t("currentSnapshot");
        } else {
          const compareButton = card.querySelector(".history-action.compare");
          const deleteButton = card.querySelector(".history-action.delete");
          const isBusyCompare = busyAction === "compare" && Number(busySnapshotId) === Number(item.id);
          const isBusyDelete = busyAction === "delete" && Number(busySnapshotId) === Number(item.id);
          compareButton.disabled = isBusyCompare || busyAction === "delete";
          deleteButton.disabled = isBusyDelete || busyAction === "compare";
          // The active card's compare button toggles the comparison off.
          const compareLabel = isActive ? t("cancelCompare") : t("compare");
          compareButton.title = compareLabel;
          compareButton.setAttribute("aria-label", compareLabel);
          compareButton.setAttribute("aria-pressed", String(isActive));
          deleteButton.title = t("delete");
          deleteButton.setAttribute("aria-label", t("delete"));
          compareButton.classList.toggle("busy", isBusyCompare);
          deleteButton.classList.toggle("busy", isBusyDelete);
          compareButton.innerHTML = isBusyCompare
            ? t("compareBusy")
            : `
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.8"/>
                <path d="M12 6V18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <rect x="6.5" y="8" width="3" height="8" rx="1" fill="currentColor" opacity="0.9"/>
                <rect x="14.5" y="6.5" width="3" height="11" rx="1" fill="currentColor" opacity="0.45"/>
              </svg>
            `;
          deleteButton.innerHTML = isBusyDelete
            ? t("deleteBusy")
            : `
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 7H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M9 4H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <rect x="6" y="7" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M10 11V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M14 11V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            `;
          compareButton.addEventListener("click", () =>
            isActive ? clearCompare() : loadCompare(item.id)
          );
          deleteButton.addEventListener("click", () => deleteSnapshot(item.id));
        }
        el.historyList.appendChild(card);
      }
    }



    // Leave compare mode and show the plain live positions again.
    function clearCompare() {
      if (!latestPayload) return;
      activeCompareSnapshotId = null;
      latestComparePayload = null;
      lastRenderedClosedSince = null;
      changeFilter = "all";
      renderPositions(latestPayload.positions || []);
      renderComparePnl(null);
      renderHistory(latestPayload.history || [], latestPayload.snapshot?.id);
    }

    async function loadCompare(snapshotId, options = {}) {
      if (!latestPayload) return;
      const { silent = false } = options;

      activeCompareSnapshotId = snapshotId;
      setHistoryActionState("compare", snapshotId);
      if (!silent) {
        setOverlayState(
          true,
          t("loadingCompareTitle"),
          "compare"
        );
        setStatus(t("statusLoadingCompare"));
      }
      try {
        const response = await fetch(`/api/compare?snapshot_id=${encodeURIComponent(snapshotId)}`);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Compare request failed");
        }
        latestComparePayload = data;
        lastRenderedClosedSince = data.closedSince || null;
        changeFilter = "all";
        hideUnchangedMarkets = defaultCompareView === "simplified";
        renderPositions(data.positions || [], data.compareSnapshot || null);
        renderComparePnl(data.compareSnapshot || null);
        renderHistory(latestPayload.history || [], latestPayload.snapshot?.id);
        setStatus("");
      } catch (error) {
        setStatus(
          silent
            ? t("statusCompareFailedDefault", { message: error.message })
            : t("statusCompareFailed", { message: error.message })
        );
      } finally {
        setHistoryActionState(null, null);
        if (!silent) {
          setOverlayState(false);
        }
      }
    }

    async function deleteSnapshot(snapshotId) {
      const target = (latestPayload?.history || []).find((item) => Number(item.id) === Number(snapshotId));
      const confirmed = await confirmDialog({
        title: t("deleteConfirmTitle"),
        body: target
          ? t("deleteConfirmBody", { time: formatSnapshotTime(target.snapshot_at), value: formatMoney(target.total_assets) })
          : t("deleteConfirm", { snapshotId }),
        confirmLabel: t("deleteAction"),
        cancelLabel: t("cancelAction")
      });
      if (!confirmed) {
        return;
      }

      setStatus(t("statusDeleting"));
      setHistoryActionState("delete", snapshotId);
      setOverlayState(
        true,
        t("loadingDeleteTitle"),
        "delete"
      );
      debugLog("deleteSnapshot:start", { snapshotId });
      try {
        const response = await fetch(`/api/delete-snapshot?snapshot_id=${encodeURIComponent(snapshotId)}`);
        const data = await response.json();
        debugLog("deleteSnapshot:response", {
          ok: response.ok,
          status: response.status,
          deletedSnapshotId: data?.deletedSnapshotId,
          snapshotId: data?.snapshot?.id
        });
        if (!response.ok) {
          throw new Error(data.error || "Delete snapshot request failed");
        }

        latestPayload = data;
        historyPage = 1;
        activeCompareSnapshotId = null;
        latestComparePayload = null;
        hideUnchangedMarkets = defaultCompareView === "simplified";
        renderSnapshot(data.snapshot, data.walletAddress);
        renderPositions(data.positions || []);
        renderComparePnl(null);
        renderHistory(data.history || [], data.snapshot?.id);
        setStatus(t("statusDeleted"), 4000);
      } catch (error) {
        debugLog("deleteSnapshot:error", { snapshotId, message: error.message });
        setStatus(t("statusDeleteFailed", { message: error.message }));
      } finally {
        setHistoryActionState(null, null);
        setOverlayState(false);
      }
    }

    async function loadDashboard(options = {}) {
      const { silent = false } = options;
      if (!silent) {
        setStatus(t("statusLoading"));
      }
      try {
        debugLog("loadDashboard:start");
        const response = await fetch("/api/dashboard");
        const data = await response.json();
        debugLog("loadDashboard:response", {
          ok: response.ok,
          status: response.status,
          snapshotId: data?.snapshot?.id,
          historyCount: data?.history?.length
        });

        if (!response.ok) {
          throw new Error(data.error || "Dashboard request failed");
        }

        latestPayload = data;
        historyPage = 1;
        activeCompareSnapshotId = null;
        latestComparePayload = null;
        hideUnchangedMarkets = defaultCompareView === "simplified";
        renderSnapshot(data.snapshot, data.walletAddress);
        renderPositions(data.positions || []);
        renderComparePnl(null);
        renderHistory(data.history || [], data.snapshot?.id);
        setStatus("");
        // When showing a stored snapshot, compare against the one before it, not itself.
        const latestHistorySnapshotId = (data.history || [])
          .find((row) => row.id !== data.snapshot?.id)?.id;
        if (latestHistorySnapshotId) {
          await loadCompare(latestHistorySnapshotId, { silent: true });
        }
      } catch (error) {
        debugLog("loadDashboard:error", { message: error.message });
        latestPayload = null;
        historyPage = 1;
        activeCompareSnapshotId = null;
        latestComparePayload = null;
        hideUnchangedMarkets = defaultCompareView === "simplified";
        renderSnapshot(null, "");
        renderPositions([]);
        renderHistory([], null);
        setStatus(t("statusLoadFailed", { message: error.message }));
      }
    }

    async function refreshData() {
      if (isRefreshing) return;

      setRefreshingState(true);
      setStatus(t("statusRefreshing"));
      debugLog("refreshData:start");
      try {
        const response = await fetch("/api/refresh");
        const data = await response.json();
        debugLog("refreshData:response", {
          ok: response.ok,
          status: response.status,
          refresh: data?.refresh,
          snapshotId: data?.snapshot?.id
        });
        if (!response.ok) {
          throw new Error(data.error || "Refresh request failed");
        }

        latestPayload = data;
        historyPage = 1;
        activeCompareSnapshotId = null;
        latestComparePayload = null;
        hideUnchangedMarkets = defaultCompareView === "simplified";
        renderSnapshot(data.snapshot, data.walletAddress);
        renderPositions(data.positions || []);
        renderComparePnl(null);
        renderHistory(data.history || [], data.snapshot?.id);
        setStatus(t("statusRefreshDone", { positionsCount: data.refresh?.positionsCount || 0 }), 4000);
      } catch (error) {
        debugLog("refreshData:error", { message: error.message });
        setStatus(t("statusRefreshFailed", { message: error.message }));
        await loadDashboard({ silent: true });
      } finally {
        debugLog("refreshData:done");
        setRefreshingState(false);
      }
    }

    el.refreshBtn.addEventListener("click", refreshData);
    el.compareHighestBtn.addEventListener("click", () => {
      const snapshot = getExtremeHistorySnapshot("max");
      if (!snapshot) return;
      loadCompare(snapshot.id);
    });
    el.compareLowestBtn.addEventListener("click", () => {
      const snapshot = getExtremeHistorySnapshot("min");
      if (!snapshot) return;
      loadCompare(snapshot.id);
    });
    function openSettings() {
      settingsOpen = true;
      syncSettingsUI();
      (el.settingsPanel.querySelector(".settings-option.active") || el.settingsPanel).focus({ preventScroll: true });
    }

    function closeSettings(options = {}) {
      if (!settingsOpen) return;
      settingsOpen = false;
      syncSettingsUI();
      if (options.restoreFocus) {
        el.settingsBtn.focus();
      }
    }

    el.settingsBtn.addEventListener("click", () => {
      if (settingsOpen) {
        closeSettings();
      } else {
        openSettings();
      }
    });
    el.settingsCloseBtn.addEventListener("click", () => closeSettings({ restoreFocus: true }));
    el.settingsModal.addEventListener("click", (event) => {
      if (event.target === el.settingsModal) {
        closeSettings({ restoreFocus: true });
      }
    });
    el.confirmCancelBtn.addEventListener("click", () => closeConfirm(false));
    el.confirmOkBtn.addEventListener("click", () => closeConfirm(true));
    el.confirmModal.addEventListener("click", (event) => {
      if (event.target === el.confirmModal) closeConfirm(false);
    });
    document.addEventListener("keydown", (event) => {
      if (confirmResolver) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeConfirm(false);
        } else if (event.key === "Tab") {
          event.preventDefault();
          (document.activeElement === el.confirmCancelBtn ? el.confirmOkBtn : el.confirmCancelBtn).focus();
        }
        return;
      }
      if (event.key === "Escape") {
        if (settingsOpen) {
          event.preventDefault();
          closeSettings({ restoreFocus: true });
        }
        return;
      }
      if (event.key === "Tab" && settingsOpen && mobileSheetQuery?.matches) {
        const focusable = [...el.settingsPanel.querySelectorAll("button:not([disabled])")].filter((button) => button.offsetParent !== null);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });
    mobileSheetQuery?.addEventListener?.("change", () => {
      if (settingsOpen) syncSettingsUI();
    });
    systemDarkQuery?.addEventListener?.("change", () => {
      if (currentTheme !== "system") return;
      applyTheme();
      applyProfitColorMode();
      rerenderData();
    });
    el.themeSystemBtn.addEventListener("click", () => {
      currentTheme = "system";
      persistSettings();
      applyTheme();
      applyProfitColorMode();
      syncSettingsUI();
    });
    el.themeClassicBtn.addEventListener("click", () => {
      currentTheme = "classic";
      persistSettings();
      applyTheme();
      applyProfitColorMode();
      syncSettingsUI();
    });
    el.themeMidnightBtn.addEventListener("click", () => {
      currentTheme = "midnight";
      persistSettings();
      applyTheme();
      applyProfitColorMode();
      syncSettingsUI();
    });
    el.languageZhBtn.addEventListener("click", () => {
      currentLanguage = "zh";
      persistSettings();
      syncSettingsUI();
      rerenderData();
    });
    el.languageEnBtn.addEventListener("click", () => {
      currentLanguage = "en";
      persistSettings();
      syncSettingsUI();
      rerenderData();
    });
    el.profitColorRedBtn.addEventListener("click", () => {
      profitColorMode = "red-profit";
      persistSettings();
      applyProfitColorMode();
      syncSettingsUI();
      if (latestComparePayload?.compareSnapshot) {
        renderPositions(latestComparePayload.positions || [], latestComparePayload.compareSnapshot || null);
        renderComparePnl(latestComparePayload.compareSnapshot || null);
      } else if (latestPayload) {
        renderSnapshot(latestPayload.snapshot, latestPayload.walletAddress);
      }
    });
    el.profitColorGreenBtn.addEventListener("click", () => {
      profitColorMode = "green-profit";
      persistSettings();
      applyProfitColorMode();
      syncSettingsUI();
      if (latestComparePayload?.compareSnapshot) {
        renderPositions(latestComparePayload.positions || [], latestComparePayload.compareSnapshot || null);
        renderComparePnl(latestComparePayload.compareSnapshot || null);
      } else if (latestPayload) {
        renderSnapshot(latestPayload.snapshot, latestPayload.walletAddress);
      }
    });
    el.defaultViewSimplifiedBtn.addEventListener("click", () => {
      defaultCompareView = "simplified";
      persistSettings();
      syncSettingsUI();
      if (!latestComparePayload?.compareSnapshot) {
        hideUnchangedMarkets = true;
        return;
      }
      hideUnchangedMarkets = true;
      renderPositions(latestComparePayload.positions || [], latestComparePayload.compareSnapshot || null);
    });
    el.defaultViewFullBtn.addEventListener("click", () => {
      defaultCompareView = "full";
      persistSettings();
      syncSettingsUI();
      if (!latestComparePayload?.compareSnapshot) {
        hideUnchangedMarkets = false;
        return;
      }
      hideUnchangedMarkets = false;
      renderPositions(latestComparePayload.positions || [], latestComparePayload.compareSnapshot || null);
    });
    el.historyPrevBtn.addEventListener("click", () => {
      if (!latestPayload?.history?.length || historyPage <= 1) return;
      historyPage -= 1;
      renderHistory(latestPayload.history || [], latestPayload.snapshot?.id);
    });
    el.historyNextBtn.addEventListener("click", () => {
      const totalPages = Math.max(1, Math.ceil((latestPayload?.history?.length || 0) / HISTORY_PAGE_SIZE));
      if (!latestPayload?.history?.length || historyPage >= totalPages) return;
      historyPage += 1;
      renderHistory(latestPayload.history || [], latestPayload.snapshot?.id);
    });
    window.addEventListener("click", (event) => {
      if (
        settingsOpen &&
        !el.settingsAnchor.contains(event.target)
      ) {
        closeSettings();
      }
    });
    el.walletChip.addEventListener("click", copyWalletAddress);
    window.addEventListener("load", () => {
      loadSettings();
      applyTheme();
      applyProfitColorMode();
      syncSettingsUI();
      loadDashboard();
    });
  </script>
</body>
</html>
